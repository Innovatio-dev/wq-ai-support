<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search with AI · WealthQuest Support</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/urbanist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/ai.js"></script>
</head>
<body class="ai-page">
  <div class="page">
    <div id="site-header"></div>
    <div class="glow" aria-hidden="true"></div>
    <main class="col">
      <div class="ai-head">
        <a class="back-btn" href="/" aria-label="Back to WealthQuest Support" id="back"></a>
        <h1 class="title">Search with AI</h1>
      </div>

      <form class="qbox has-send" id="ask" autocomplete="off">
        <label class="sr-only" for="q">Your question</label>
        <textarea id="q" maxlength="2000" placeholder="Ask a question or describe your issue..."></textarea>
        <button class="round-btn" type="submit" aria-label="Send" id="send"></button>
      </form>

      <div class="working" id="working" hidden><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="status">Working on your answer</span></div>
      <div class="inline-error" id="error" role="alert" hidden></div>

      <section class="answer" id="answer" hidden aria-live="polite">
        <h2 class="h2">Answer</h2>
        <div class="md" id="md"></div>
        <div id="ticket"></div>
        <p class="disclaimer">Answers are generated by AI, and may not always be accurate.</p>
        <form class="followup" id="followup" autocomplete="off" hidden>
          <div class="pill-input">
            <label class="sr-only" for="fu">Ask a follow-up question</label>
            <input id="fu" maxlength="2000" placeholder="Ask a follow-up question...">
            <button class="round-btn" type="submit" aria-label="Send follow-up" id="fu-send"></button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
