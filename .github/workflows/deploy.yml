name: Deploy

# Same shape as the main app's deploy workflows. The image is built and pushed
# under an immutable tag WHILE the tests run; once both pass, the floating tag
# the environment's task definition runs is moved onto that image and the ECS
# service is forced onto it.
#
#   staging     every push to main      :<sha>             -> :latest
#   production  manual, type to confirm :production-<sha>  -> :production
#
# The task definition is owned by Terraform (infra/terraform). CI never authors
# one - CPU, memory, environment and secrets are Terraform changes.
#
# Auth: GitHub OIDC -> wq-ai-support-github-deploy (infra/terraform/envs/staging/
# github-deploy.tf). It trusts only jobs running in this repo's `staging` and
# `production` environments. No long-lived AWS keys.
#
# GitHub environment variables (per environment):
#   AWS_DEPLOY_ROLE_ARN   arn:aws:iam::156299069207:role/wq-ai-support-github-deploy
#   AWS_REGION            us-east-1
#   ECR_REPOSITORY        wealthquest/ai-support
#   ECS_CLUSTER           wealth-quest | wealth-quest-production
#   ECS_SERVICE           wq-ai-support-app | wq-prod-ai-support-app
#   APP_URL               https://help-staging.wealthquest.com | https://help.wealthquest.com

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: Type "production" to deploy to production
        type: string
        default: ""

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TARGET: ${{ inputs.environment || 'staging' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    name: Build image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    outputs:
      sha: ${{ steps.tags.outputs.sha }}
      build_tag: ${{ steps.tags.outputs.build_tag }}
      run_tag: ${{ steps.tags.outputs.run_tag }}

    steps:
      - name: Confirm a production deploy
        if: ${{ env.TARGET == 'production' && inputs.confirm != 'production' }}
        run: |
          echo "::error::Type \"production\" in the confirm field to deploy to production."
          exit 1

      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Production builds get their own prefix so a production tag can never be
      # mistaken for (or overwritten by) a staging build of the same commit.
      - name: Set image tags
        id: tags
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::12}"
          if [ "$TARGET" = "production" ]; then
            build_tag="production-$sha"; run_tag="production"
          else
            build_tag="$sha"; run_tag="latest"
          fi
          echo "sha=$sha"             >>"$GITHUB_OUTPUT"
          echo "build_tag=$build_tag" >>"$GITHUB_OUTPUT"
          echo "run_tag=$run_tag"     >>"$GITHUB_OUTPUT"
          echo "image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:$build_tag" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only the immutable tag: the tests may still fail.
      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.image }}
          build-args: |
            APP_COMMIT=${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll ECS service
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Promote the tested image
        run: bash .github/scripts/promote-image.sh "${{ vars.ECR_REPOSITORY }}" "${{ needs.build.outputs.build_tag }}" "${{ needs.build.outputs.run_tag }}"

      - name: Force new deployment
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --force-new-deployment \
            --no-cli-pager >/dev/null

      # After a circuit-breaker rollback the service is stable again on the old
      # task set, so `services-stable` alone would report success for a failed
      # release. Only rolloutState tells them apart, and it turns terminal a few
      # seconds after the service goes stable - so poll.
      - name: Wait for rollout, then verify it actually succeeded
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "$CLUSTER" --services "$SERVICE" --no-cli-pager

          for _ in $(seq 1 30); do
            state=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" \
              --query "services[0].deployments[?status=='PRIMARY'].rolloutState | [0]" \
              --output text --no-cli-pager)
            case "$state" in
              COMPLETED) echo "rolloutState=COMPLETED"; exit 0 ;;
              FAILED)
                echo "::error::Deployment FAILED - the circuit breaker rolled it back. Check the service's Events tab and the task logs."
                exit 1 ;;
            esac
            echo "rolloutState=$state - waiting"
            sleep 5
          done

          echo "::error::rolloutState never reached COMPLETED or FAILED within 150s of the service going stable."
          exit 1

      # A 200 alone can't tell this release from the previous one; the commit can.
      - name: Smoke test (healthz reports this commit)
        run: bash .github/scripts/verify-commit.sh "${{ vars.APP_URL }}" "${{ needs.build.outputs.sha }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy: \`$TARGET\`"
            echo "- image: \`${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.build_tag }}\` (promoted to \`:${{ needs.build.outputs.run_tag }}\`)"
            echo "- service: \`${{ vars.ECS_CLUSTER }}/${{ vars.ECS_SERVICE }}\`"
            echo "- url: ${{ vars.APP_URL }}"
          } >>"$GITHUB_STEP_SUMMARY"
